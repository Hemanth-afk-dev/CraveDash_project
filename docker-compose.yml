services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: cravedash_user_db
      MYSQL_USER: cravedash_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cravedash
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  eureka-server:
    build:
      context: ./eureka-server/eureka-server
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8761
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - cravedash
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8761/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service/user-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cravedash_user_db
      DB_USERNAME: cravedash_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - cravedash
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8084"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  restaurant-service:
    build:
      context: ./restaurant-service/restaurant-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cravedash_restaurant_db
      DB_USERNAME: cravedash_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: restaurant-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - cravedash
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service/order-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cravedash_order_db
      DB_USERNAME: cravedash_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    networks:
      - cravedash
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8082"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  payment-service:
    build:
      context: ./payment-service/payment-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cravedash_payment_db
      DB_USERNAME: cravedash_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: payment-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - cravedash
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8083"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway/api-gateway
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      REACT_APP_ORIGIN: ${REACT_APP_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - cravedash
    healthcheck:
      test: ["CMD-SHELL", "wget -q --server-response -O /dev/null http://127.0.0.1:8080/auth/me 2>&1 | grep -q 401"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - cravedash
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  cravedash:
    driver: bridge

volumes:
  mysql-data:
