spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=order-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/orders/**

spring.cloud.gateway.server.webmvc.routes[1].id=restaurant-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://RESTAURANT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/restaurants/**

spring.cloud.gateway.server.webmvc.routes[2].id=payment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/payments/**

spring.cloud.gateway.server.webmvc.routes[3].id=user-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/auth/**

jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${REACT_APP_ORIGIN:http://localhost:5173}
